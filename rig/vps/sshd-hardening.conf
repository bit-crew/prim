# Managed by prim: rig/vps/sshd-hardening.conf, installed by
# rig/vps/harden-vps.sh. Do not edit it on the host: the next harden-vps
# run rewrites this file from the repo.
#
# The name sorts BEFORE 50-cloud-init.conf on purpose. OpenSSH keeps the
# FIRST value obtained for a keyword, and the Include sits at the top of
# sshd_config. cloud-init ships "PasswordAuthentication yes" in
# 50-cloud-init.conf, which silently beat the main config's "no" (line 57)
# and left password logins enabled.
#
# Key-only login. The evidence for it on this host: every successful login
# in the last 60 days was a publickey login as 'debian' (234 of them), while
# password attempts were pure brute force (67k in 14 days, 28k of them
# against root and 454 against debian). Root never logs in over ssh.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey

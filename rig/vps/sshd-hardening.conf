# Managed by prim: rig/vps/sshd-hardening.conf, installed by
# rig/vps/harden-vps.sh. Do not edit it on the host: the next harden-vps
# run rewrites this file from the repo.
#
# The name sorts BEFORE 50-cloud-init.conf on purpose. OpenSSH keeps the
# FIRST value obtained for a keyword, and the Include sits at the top of
# sshd_config. cloud-init ships "PasswordAuthentication yes" in
# 50-cloud-init.conf, which otherwise wins over the main config.
#
# Policy for port 22 (the only port this host exposes to the Internet):
#   - SSH with a public key OR with user + password. Both are allowed on
#     purpose: the phone and some clients carry a key, others only carry
#     the account password, and the tailnet is not the only way in.
#   - No other kind of connection: keyboard-interactive is off, empty
#     passwords are refused, root may not log in, and only the 'debian'
#     account may log in at all.
#   - The brute force that this port sees (67k attempts in 14 days, 28k
#     against root) is answered with a short login grace time, few auth
#     tries per connection and a cap on parallel unauthenticated
#     connections.
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey password
AllowUsers debian
LoginGraceTime 20
MaxAuthTries 5
MaxStartups 10:30:30

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint install scripts
        run: |
          shellcheck install.sh rig/install.sh harness/install.sh

  chezmoi-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Render rig dotfile templates for both profiles
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for profile in dc1 vps; do
            echo "=== profile: $profile ==="
            cfg="$(mktemp -d)/chezmoi.toml"
            chezmoi init --source rig/home --config-path "$cfg" \
              --promptString "Perfil (dc1|vps)=$profile" \
              --promptString "Nombre para git=CI" \
              --promptString "Email para git=ci@example.com"
            chezmoi execute-template --source rig/home --config "$cfg" \
              < rig/home/dot_zshrc.tmpl > /dev/null
            chezmoi execute-template --source rig/home --config "$cfg" \
              < rig/home/dot_config/herdr/config.toml.tmpl > /dev/null
            chezmoi execute-template --source rig/home --config "$cfg" \
              < rig/home/dot_config/helix/config.toml.tmpl > /dev/null
            echo "render OK"
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + components
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup default stable
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

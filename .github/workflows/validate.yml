name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint install scripts
        run: |
          # install.sh is the repo entry point; harness + files are their
          # components; rig/vps holds the host pieces (harden-vps, inbox
          # cleanup) and rig/client the client helpers (clipboard grab).
          # All must stay shellcheck-clean.
          shellcheck install.sh harness/install.sh files/install.sh files/sync-work.sh rig/vps/harden-vps.sh rig/vps/prim-inbox-cleanup rig/client/img-grab rig/client/install-img-grab.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + components
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup default stable
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
